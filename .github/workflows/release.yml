name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}".TrimStart("v") }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected version '$version'" }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building JuiceBar $version"

      - name: Fetch pinned MinGW-w64 toolchain
        shell: pwsh
        run: ./scripts/toolchain.ps1

      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Version "${{ steps.version.outputs.value }}" -Tests

      - name: Build installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: juicebar-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: JuiceBar ${{ steps.version.outputs.value }}
          draft: true
          prerelease: false
          body_path: docs/RELEASE_NOTES.md
          files: dist/JuiceBar-${{ steps.version.outputs.value }}-setup.exe
